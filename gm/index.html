<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SWADE & StarBreaker Reference</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header class="panel-header">
        <h1>Quick Reference</h1>
        <div class="sidebar-tools">
          <input id="sidebarSearch" type="search" placeholder="Search notes, books, pages" autocomplete="off" />
          <button id="clearSidebarSearch" type="button">Clear</button>
        </div>
      </header>
      <div class="sidebar-body" id="sidebarBody">
        <div class="sidebar-content" id="sidebarContent"></div>
      </div>

    </aside>

    <div class="sidebar-resizer" id="sidebarResizer" aria-hidden="true"></div>

    <main class="main">
      <header class="panel-header">
        <div class="panel-header-row">
          <h1>Rulebooks</h1>
          <button id="bookVisibilityButton" type="button" class="icon-button" aria-label="Choose visible books" title="Choose visible books">☰</button>
        </div>
      </header>

      <div class="tabs" id="tabs"></div>

      <section class="viewer-shell">
        <div class="topbar">
          <div class="pages" id="pageLinks"></div>
        </div>
        <div class="frame" id="viewerFrame"></div>
      </section>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="data/config.js"></script>
  <script src="data/sidebar.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/popup.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/capture.js"></script>
  <script src="js/search.js"></script>
  <script src="js/pdfviewer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
