<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GM Reference</title>
  <script>
    (function () {
      try {
        const raw = localStorage.getItem('gm_screen_state_v5');
        const parsed = raw ? JSON.parse(raw) : {};
        const mode = parsed && typeof parsed.themeMode === 'string' ? parsed.themeMode : 'dark';
        const resolved = mode === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : (mode === 'light' ? 'light' : 'dark');
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      } catch (err) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.colorScheme = 'dark';
      }
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="180x180" href="icons/icon-180.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#19191c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GM">
  <link rel="stylesheet" href="libs/codemirror/lib/codemirror.css">
  <link rel="stylesheet" href="libs/easymde/easymde.min.css">
  <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header class="panel-header">
        <h1>Quick Reference</h1>
        <div class="sidebar-tools">
          <div class="sidebar-search-row">
            <input id="sidebarSearch" type="search" placeholder="Search notes, books, pages" autocomplete="off" />
            <button id="clearSidebarSearch" type="button">Clear</button>
          </div>
          <label class="sidebar-search-toggle">
            <input id="searchIncludeHiddenBooks" type="checkbox" />
            Include hidden books
          </label>
        </div>
      </header>
      <div class="sidebar-body" id="sidebarBody">
        <div class="sidebar-content" id="sidebarContent"></div>
      </div>

    </aside>

    <div class="sidebar-resizer" id="sidebarResizer" aria-hidden="true"></div>

    <main class="main">
      <header class="panel-header">
        <div class="panel-header-row">
          <h1>Rulebooks</h1>
          <div class="panel-header-actions">
            <button id="themeButton" type="button" class="icon-button" aria-label="Theme: Dark. Click to switch." title="Theme: Dark. Click to switch.">☾</button>
          <button id="bookVisibilityButton" type="button" class="icon-button" aria-label="Choose visible books" title="Choose visible books">☰</button>
          </div>
        </div>
      </header>

      <div class="tabs" id="tabs"></div>

      <section class="viewer-shell">
        <div class="topbar">
          <div class="pages" id="pageLinks"></div>
        </div>
        <div class="frame" id="viewerFrame"></div>
      </section>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="data/config.js"></script>
  <script src="libs/codemirror/lib/codemirror.js"></script>
  <script src="libs/codemirror/mode/markdown/markdown.js"></script>
  <script src="libs/easymde/easymde.min.js"></script>
  <script src="data/sidebar.js?v=20260816-clean-no-trace"></script>
  <script src="js/storage.js"></script>
  <script src="js/popup.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/capture.js"></script>
  <script src="js/search.js"></script>
  <script src="js/pdfviewer.js"></script>
  <script src="js/ui.js?v=20260816-save-readonly-title"></script>
  <script src="js/app.js"></script>
</body>
</html>
